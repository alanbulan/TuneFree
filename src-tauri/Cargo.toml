[package]
name = "app"
version = "1.1.29"
description = "TuneFree Desktop - Modern desktop music player"
authors = ["AlanBulan"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Lint posture, single source of truth. CI, the release pipeline and local
# `cargo clippy` all share these settings; command lines only add `-D warnings`
# to promote the remaining warn-level lints to errors.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "deny"
dbg_macro = "deny"
todo = "deny"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-opener = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
tower-http = { version = "0.7.0", features = ["cors"] }
aes = "0.9.1"
md5 = "0.8.1"
base64 = "0.22"
url = "2"
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
parking_lot = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
