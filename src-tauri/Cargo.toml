[package]
name = "app"
version = "1.1.40"
description = "TuneFree Desktop - Modern desktop music player"
authors = ["AlanBulan"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Lint posture, single source of truth. CI, the release pipeline and local
# `cargo clippy` all share these settings; command lines only add `-D warnings`
# to promote the remaining warn-level lints to errors.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "deny"
dbg_macro = "deny"
todo = "deny"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# 同一套源码测试在显式目标中运行，便于单独链接 Windows 原生宿主清单。
test = false

[[test]]
name = "app_tests"
path = "src/test_host.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
tauri = { version = "2.12.5", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
tower-http = { version = "0.7.1", features = ["cors"] }
aes = "0.9.4"
md5 = "0.8.1"
# Reuse the system RNG already present in Cargo.lock.
getrandom = "=0.4.3"
base64 = "0.23.1"
url = "2.5.8"
thiserror = "2.0.21"
async-trait = "0.1.92"
rusqlite = { version = "0.41.1", features = ["bundled"] }
parking_lot = "0.13.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# v1 接口统一使用 Windows Credential Manager / macOS Keychain，保留原凭据标识。
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
