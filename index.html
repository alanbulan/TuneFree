<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      /* 首帧主题引导：必须同步执行，逻辑与 utils/theme.ts 的 applyStoredThemeToDocument
         保持一致，否则暗色用户每次启动都会先闪一帧浅色。 */
      (function () {
        try {
          var KEYS = { mode: 'tunefree_theme_mode', color: 'tunefree_theme_color', size: 'tunefree_lyric_size', font: 'tunefree_lyric_font' };
          var DEFAULT_ACCENT = '#fa233b';
          var LEGACY = { red: '#fa233b', blue: '#007aff', green: '#34c759', purple: '#af52de', orange: '#ff9500' };
          var FONTS = ['system-ui', 'system-ui, -apple-system, BlinkMacSystemFont, sans-serif', '"PingFang SC", "Helvetica Neue", sans-serif', '"Microsoft YaHei", sans-serif', '"SimSun", serif', '"STXihei", "STHeiti", sans-serif'];
          var read = function (key) { try { return localStorage.getItem(key); } catch (error) { return null; } };
          var normalizeColor = function (value) {
            if (LEGACY[value]) return LEGACY[value];
            if (/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(String(value || '').trim())) {
              var h = String(value).trim();
              if (h.charAt(0) !== '#') h = '#' + h;
              if (h.length === 4) h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
              return h.toLowerCase();
            }
            return DEFAULT_ACCENT;
          };
          var mode = read(KEYS.mode) === 'dark' || read(KEYS.mode) === 'light' ? read(KEYS.mode) : 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var baseHex = normalizeColor(read(KEYS.color));
          function lighten(hex) {
            var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            var rn = r / 255, gn = g / 255, bn = b / 255, max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn), d = max - min;
            var h = 0, s = 0, l = (max + min) / 2;
            if (d !== 0) {
              s = d / (1 - Math.abs(2 * l - 1));
              if (max === rn) h = ((gn - bn) / d) % 6;
              else if (max === gn) h = (bn - rn) / d + 2;
              else h = (rn - gn) / d + 4;
              h *= 60; if (h < 0) h += 360;
            }
            var l2 = Math.min(72, (l * 100 + 8)) / 100;
            var c = (1 - Math.abs(2 * l2 - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l2 - c / 2;
            var R = 0, G = 0, B = 0;
            if (h < 60) { R = c; G = x; }
            else if (h < 120) { R = x; G = c; }
            else if (h < 180) { G = c; B = x; }
            else if (h < 240) { R = 0; G = x; B = c; }
            else if (h < 300) { R = x; B = c; }
            else { R = c; B = x; }
            var to = function (n) { return Math.round((n + m) * 255).toString(16).padStart(2, '0'); };
            return '#' + to(R) + to(G) + to(B);
          }
          var accent = isDark ? lighten(baseHex) : baseHex;
          var danger = isDark ? lighten('#fa233b') : '#fa233b';
          /* 空格分隔的通道串：Tailwind 的 rgb(var(--accent-rgb) / <alpha-value>) 配方要求这种格式 */
          function rgb(hex) { return parseInt(hex.slice(1, 3), 16) + ' ' + parseInt(hex.slice(3, 5), 16) + ' ' + parseInt(hex.slice(5, 7), 16); }
          var root = document.documentElement;
          root.classList.toggle('dark-theme', isDark);
          root.classList.toggle('light-theme', !isDark);
          root.style.setProperty('--accent', accent);
          root.style.setProperty('--play', accent);
          root.style.setProperty('--danger', danger);
          root.style.setProperty('--accent-rgb', rgb(accent));
          root.style.setProperty('--danger-rgb', rgb(danger));
          root.style.setProperty('--accent-soft', 'rgb(' + rgb(accent) + ' / .12)');
          var size = parseInt(read(KEYS.size), 10);
          if (!isFinite(size)) size = 22;
          root.style.setProperty('--lyric-font-size', Math.max(14, Math.min(36, size)) + 'px');
          var font = read(KEYS.font);
          font = font && FONTS.indexOf(font.trim()) >= 0 ? font.trim() : 'system-ui';
          root.style.setProperty('--lyric-font-family', font);
        } catch (error) { /* 引导失败不影响启动：React 挂载后 ThemeProvider 会重新下发一次 */ }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TuneFree" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <title>TuneFree 音乐</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#fa233b" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ios: {
                bg: "#f2f2f7",
                card: "#ffffff",
                text: "#000000",
                subtext: "#8e8e93",
                separator: "#c6c6c8",
                blue: "#007aff",
                /*
                  强调色走 CSS 变量。<alpha-value> 是 Tailwind 的占位符，会被替换成
                  该工具类要求的透明度：bg-ios-red 生成 rgb(var(--accent-rgb) / 1)，
                  bg-ios-red/10 生成 rgb(var(--accent-rgb) / 0.1)。

                  这样纯色、半透明、以及 hover:/focus: 等所有变体都自动跟随强调色。
                  若在这里写死 hex，Tailwind 会把 rgb 值烘焙进每个工具类，
                  换色时那些半透明的地方就会留下旧颜色。
                */
                red: "rgb(var(--accent-rgb) / <alpha-value>)"
              }
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(-8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInToast: {
                '0%': { opacity: '0', transform: 'translateY(-8px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
            }
          },
        },
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      html, body {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background-color: #f2f2f7;
        color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        touch-action: pan-y;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      input, textarea {
        -webkit-user-select: text;
        user-select: text;
        font-size: 16px !important; /* 防止 iOS Safari 自动缩放 */
      }

      img { -webkit-user-drag: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      /*
        逐字歌词：每个字渲染两层。
        底层是未唱到的底色，::after 用 data-text 复制一份高亮色，
        再用 --word-progress 控制 clip-path 裁剪宽度，得到逐字扫过的填充效果。
      */
      .karaoke-line {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .karaoke-word {
        position: relative;
        display: inline-block;
        color: inherit;
        transform-origin: 50% 72%;
        transition: transform 0.14s ease;
      }

      .karaoke-word::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        color: var(--accent, #fa233b);
        clip-path: inset(0 calc(100% - var(--word-progress, 0%)) 0 0);
        transition: clip-path 0.1s linear;
        pointer-events: none;
      }

      .karaoke-word.active {
        transform: translateY(-0.035em);
      }

      /* 只有当前行显示逐字填充，其余行保持普通的灰/黑配色 */
      .lyric-line:not(.active) .karaoke-word {
        color: inherit;
      }

      .lyric-line:not(.active) .karaoke-word::after {
        visibility: hidden;
      }

      .karaoke-translation-character {
        transition: color 0.12s ease, opacity 0.12s ease;
      }

      .karaoke-translation-space {
        white-space: pre-wrap;
      }

      /*
        强调色 / 危险色：工具类由 tailwind.config 的 ios.red + --accent-rgb 驱动，
        纯色、半透明和 hover:/focus: 变体都会自己跟随，不需要在这里逐个登记。

        这里只给一个默认值，保证 JS 引导脚本执行前变量也有值；
        脚本与 ThemeContext 随后会用用户选的颜色（暗色下是加亮过的）覆盖它。
      */
      html { --accent-rgb: 250 35 59; }

      /*
        暗色主题：覆盖工具类生成的核心表面色，保证整套 UI 一体变暗。

        注意 Tailwind 会把透明度直接烘焙进工具类——bg-white/90 生成的是写死的
        rgba(255,255,255,.9)，不带任何变量。所以每个用到的透明度都必须单独登记，
        否则那一块在暗色下会原样漏出浅色。新增带 /xx 的色值类时，回到这里补一条。
      */
      html { color-scheme: light; }
      html.dark-theme { color-scheme: dark; }
      html.dark-theme body { background-color: #000; color: #f2f2f7; }

      /* 表面：页底 → 卡片 → 嵌套填充 → 抬升层 → 轨道，逐级变亮 */
      html.dark-theme .bg-ios-bg { background-color: #000; }
      html.dark-theme .bg-ios-bg\/95 { background-color: rgba(0, 0, 0, 0.95); }
      html.dark-theme .bg-ios-bg\/80 { background-color: rgba(0, 0, 0, 0.8); }
      html.dark-theme .bg-white { background-color: #1c1c1e; }
      html.dark-theme .bg-white\/95 { background-color: rgba(28, 28, 30, 0.95); }
      html.dark-theme .bg-white\/90 { background-color: rgba(28, 28, 30, 0.9); }
      html.dark-theme .bg-white\/70 { background-color: rgba(28, 28, 30, 0.7); }
      html.dark-theme .bg-white\/60 { background-color: rgba(28, 28, 30, 0.6); }
      html.dark-theme .bg-white\/50 { background-color: rgba(28, 28, 30, 0.5); }
      html.dark-theme .hover\:bg-white\/50:hover { background-color: rgba(28, 28, 30, 0.5); }
      html.dark-theme .bg-gray-50 { background-color: #242426; }
      html.dark-theme .bg-gray-100 { background-color: #2c2c2e; }
      html.dark-theme .bg-gray-200 { background-color: #3a3a3c; }
      html.dark-theme .bg-gray-200\/80 { background-color: rgba(58, 58, 60, 0.8); }
      html.dark-theme .bg-gray-200\/50 { background-color: rgba(58, 58, 60, 0.5); }
      html.dark-theme .bg-gray-300 { background-color: #48484a; }
      html.dark-theme .bg-gray-300\/80 { background-color: rgba(72, 72, 74, 0.8); }
      html.dark-theme .bg-gray-400 { background-color: #5a5a5c; }

      /* 文本 */
      html.dark-theme .text-ios-text,
      html.dark-theme .text-black,
      html.dark-theme .text-gray-900,
      html.dark-theme .text-gray-800 { color: #f2f2f7; }
      html.dark-theme .text-gray-700 { color: #e5e5ea; }
      html.dark-theme .text-gray-600 { color: #c7c7cc; }
      html.dark-theme .text-ios-subtext,
      html.dark-theme .text-gray-500 { color: #98989f; }
      html.dark-theme .text-ios-subtext\/50 { color: rgba(152, 152, 159, 0.5); }
      html.dark-theme .text-gray-500\/80 { color: rgba(152, 152, 159, 0.8); }
      html.dark-theme .text-gray-500\/60 { color: rgba(152, 152, 159, 0.6); }
      html.dark-theme .text-gray-400 { color: #6e6e73; }
      html.dark-theme .text-gray-300 { color: #48484a; }
      html.dark-theme .hover\:text-black:hover { color: #f2f2f7; }

      /* 边框 */
      html.dark-theme .border-gray-100 { border-color: #2c2c2e; }
      html.dark-theme .border-gray-200 { border-color: #3a3a3c; }
      html.dark-theme .border-gray-300 { border-color: #48484a; }

      /* 错误态：浅底深字换成低透明度红底 + 亮红字 */
      html.dark-theme .bg-red-50 { background-color: rgba(250, 35, 59, 0.14); }
      html.dark-theme .border-red-200 { border-color: rgba(250, 35, 59, 0.32); }
      html.dark-theme .text-red-500,
      html.dark-theme .text-red-600,
      html.dark-theme .text-red-700 { color: #ff6b7f; }

      /* 音源徽标：粉彩浅底在暗色下整片发亮，改成同色相半透明底 + 亮字 */
      html.dark-theme .bg-red-100 { background-color: rgba(250, 35, 59, 0.16); }
      html.dark-theme .bg-green-100,
      html.dark-theme .bg-green-50,
      html.dark-theme .bg-emerald-100 { background-color: rgba(52, 199, 89, 0.16); }
      html.dark-theme .text-green-600,
      html.dark-theme .text-emerald-700 { color: #4cd964; }
      html.dark-theme .bg-yellow-100 { background-color: rgba(255, 204, 0, 0.18); }
      html.dark-theme .text-yellow-700 { color: #ffd60a; }
      html.dark-theme .bg-blue-100 { background-color: rgba(0, 122, 255, 0.18); }
      html.dark-theme .text-blue-700 { color: #6cb2ff; }
      html.dark-theme .bg-cyan-100 { background-color: rgba(0, 199, 190, 0.18); }
      html.dark-theme .text-cyan-700 { color: #4dd8d2; }
      html.dark-theme .bg-purple-100 { background-color: rgba(175, 82, 222, 0.18); }
      html.dark-theme .text-purple-700 { color: #c98cf0; }
      html.dark-theme .bg-pink-100 { background-color: rgba(255, 45, 85, 0.18); }
      html.dark-theme .text-pink-700 { color: #ff7a9c; }

      html.dark-theme .glass {
        background: rgba(28, 28, 30, 0.8);
        border-color: rgba(255, 255, 255, 0.06);
      }

      /* 黑底控件（播放键 / 分段控件选中态）在暗色下反转为白底黑字 */
      html.dark-theme .bg-black.text-white {
        background-color: #f2f2f7;
        color: #000;
      }

      /* 分段控件：暗色下轨道已经比页底亮，选中的药丸要再亮一档才分得出来 */
      html.dark-theme .bg-gray-200\/50 > .bg-white,
      html.dark-theme .bg-gray-200\/80 > .bg-white {
        background-color: #48484a;
      }

      /* 原生控件与选中描边 */
      html.dark-theme .accent-black { accent-color: #f2f2f7; }
      html.dark-theme .ring-gray-900 { --tw-ring-color: #f2f2f7; }
      html.dark-theme .ring-offset-2 { --tw-ring-offset-color: #1c1c1e; }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
