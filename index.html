<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="description" content="桌面端多源音乐播放器，包含稳定播放链路、GD Studio 扩展源和可拖动 Mira 桌面宠物" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>TuneFree Desktop</title>
    <script>
      /* 首帧主题引导：必须同步执行，逻辑与 src/core/utils/theme.ts 的
         applyStoredThemeToDocument 保持一致，否则暗色用户每次启动都会先闪一帧浅色。 */
      (function () {
        try {
          var KEYS = {
            mode: 'tunefree_theme_mode',
            color: 'tunefree_theme_color',
            size: 'tunefree_lyric_size',
            font: 'tunefree_lyric_font'
          };
          var DEFAULT_ACCENT = '#fa233b';
          var LEGACY = { red: '#fa233b', blue: '#007aff', green: '#34c759', purple: '#af52de', orange: '#ff9500' };
          var FONTS = [
            'system-ui',
            'system-ui, -apple-system, BlinkMacSystemFont, sans-serif',
            '"PingFang SC", "Helvetica Neue", sans-serif',
            '"Microsoft YaHei", sans-serif',
            '"SimSun", serif',
            '"STXihei", "STHeiti", sans-serif'
          ];
          var read = function (key) {
            try { return localStorage.getItem(key); } catch (error) { return null; }
          };
          var normalizeHex = function (value) {
            var hex = String(value).trim();
            if (hex.charAt(0) !== '#') hex = '#' + hex;
            if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
            return hex.toLowerCase();
          };
          var resolveColor = function (value) {
            if (typeof value === 'string') {
              if (LEGACY[value]) return LEGACY[value];
              if (/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(value.trim())) return normalizeHex(value);
            }
            return DEFAULT_ACCENT;
          };
          var toRgb = function (hex) {
            var h = normalizeHex(hex);
            return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
          };
          var toRgbText = function (hex) {
            var c = toRgb(hex);
            return c[0] + ', ' + c[1] + ', ' + c[2];
          };
          var lightenForDark = function (hex) {
            var c = toRgb(hex);
            var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
            var max = Math.max(r, g, b), min = Math.min(r, g, b), delta = max - min;
            var h = 0, s = 0, l = (max + min) / 2;
            if (delta !== 0) {
              s = delta / (1 - Math.abs(2 * l - 1));
              if (max === r) h = ((g - b) / delta) % 6;
              else if (max === g) h = (b - r) / delta + 2;
              else h = (r - g) / delta + 4;
              h *= 60;
              if (h < 0) h += 360;
            }
            h = Math.round(h);
            s = Math.round(s * 100);
            l = Math.min(72, Math.round(l * 100) + 8);
            var sn = s / 100, ln = l / 100;
            var chroma = (1 - Math.abs(2 * ln - 1)) * sn;
            var x = chroma * (1 - Math.abs(((h / 60) % 2) - 1));
            var m = ln - chroma / 2;
            var rr = 0, gg = 0, bb = 0;
            if (h < 60) { rr = chroma; gg = x; }
            else if (h < 120) { rr = x; gg = chroma; }
            else if (h < 180) { gg = chroma; bb = x; }
            else if (h < 240) { gg = x; bb = chroma; }
            else if (h < 300) { rr = x; bb = chroma; }
            else { rr = chroma; bb = x; }
            var channel = function (n) {
              var v = Math.round((n + m) * 255).toString(16);
              return v.length < 2 ? '0' + v : v;
            };
            return '#' + channel(rr) + channel(gg) + channel(bb);
          };

          var mode = read(KEYS.mode);
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
          var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var accent = resolveColor(read(KEYS.color));
          if (isDark) accent = lightenForDark(accent);
          var danger = isDark ? lightenForDark(DEFAULT_ACCENT) : DEFAULT_ACCENT;
          var accentRgb = toRgbText(accent);

          var root = document.documentElement;
          root.classList.toggle('dark-theme', isDark);
          root.classList.toggle('light-theme', !isDark);
          root.style.setProperty('--accent', accent);
          root.style.setProperty('--play', accent);
          root.style.setProperty('--danger', danger);
          root.style.setProperty('--accent-rgb', accentRgb);
          root.style.setProperty('--danger-rgb', toRgbText(danger));
          root.style.setProperty('--accent-soft', 'rgba(' + accentRgb + ',.12)');

          var size = parseInt(read(KEYS.size), 10);
          if (!isFinite(size)) size = 22;
          root.style.setProperty('--lyric-font-size', Math.max(14, Math.min(36, size)) + 'px');
          var font = read(KEYS.font);
          font = font && FONTS.indexOf(font.trim()) >= 0 ? font.trim() : 'system-ui';
          root.style.setProperty('--lyric-font-family', font);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#09090b' : '#f2f2f7');
        } catch (error) {
          /* 引导失败不影响启动：React 挂载后 ThemeProvider 会重新下发一次主题 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
