<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TuneFree" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <title>TuneFree 音乐</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#fa233b" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ios: {
                bg: "#f2f2f7",
                card: "#ffffff",
                text: "#000000",
                subtext: "#8e8e93",
                separator: "#c6c6c8",
                blue: "#007aff",
                red: "#fa233b"
              }
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(-8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInToast: {
                '0%': { opacity: '0', transform: 'translateY(-8px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
            }
          },
        },
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      html, body {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background-color: #f2f2f7;
        color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        touch-action: pan-y;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      input, textarea {
        -webkit-user-select: text;
        user-select: text;
        font-size: 16px !important; /* 防止 iOS Safari 自动缩放 */
      }

      img { -webkit-user-drag: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      /*
        逐字歌词：每个字渲染两层。
        底层是未唱到的底色，::after 用 data-text 复制一份高亮色，
        再用 --word-progress 控制 clip-path 裁剪宽度，得到逐字扫过的填充效果。
      */
      .karaoke-line {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .karaoke-word {
        position: relative;
        display: inline-block;
        color: inherit;
        transform-origin: 50% 72%;
        transition: transform 0.14s ease;
      }

      .karaoke-word::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        color: #fa233b;
        clip-path: inset(0 calc(100% - var(--word-progress, 0%)) 0 0);
        transition: clip-path 0.1s linear;
        pointer-events: none;
      }

      .karaoke-word.active {
        transform: translateY(-0.035em);
      }

      /* 只有当前行显示逐字填充，其余行保持普通的灰/黑配色 */
      .lyric-line:not(.active) .karaoke-word {
        color: inherit;
      }

      .lyric-line:not(.active) .karaoke-word::after {
        visibility: hidden;
      }

      .karaoke-translation-character {
        transition: color 0.12s ease, opacity 0.12s ease;
      }

      .karaoke-translation-space {
        white-space: pre-wrap;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?deps=react@18.2.0,react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0,react-dom@18.2.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body oncontextmenu="return false;">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
