name: Validate

# 质量门禁的唯一事实来源：ci.yml（push / PR）与 release.yml（v* 标签）都通过
# workflow_call 复用本文件，保证"能发布"和"CI 通过"是同一套检查。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / typecheck / test)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm install --global npm@12.0.2
      - run: npm ci

      - run: npm run version:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run architecture:check
      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      # 高危及以上依赖漏洞阻断 CI 和发布。
      - name: Audit npm dependencies
        run: npm run audit

  rust:
    name: Rust (fmt / clippy / test / build)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Read Rust toolchain
        id: rust
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel = "([^"]+)"$'
          if (-not $match) { throw 'Rust toolchain version is missing' }
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm install --global npm@12.0.2
      - run: npm ci

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # lint 姿态固化在 src-tauri/Cargo.toml 的 [lints] 段，这里只负责把告警提升为错误。
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test app_tests -- --include-ignored

      # tauri.conf.json 的 beforeBuildCommand 已经会执行 `npm run build`（tsc + vite build），
      # 不要在此之外再单独跑一次前端构建。
      - run: npx tauri build --no-bundle

      # 启动构建产物并断言主界面挂载且本地服务就绪。编译、clippy 与单元测试都
      # 无法发现「能编译但起不来」的故障（v1.1.28 即如此发布），这一步是唯一
      # 真正运行应用的检查。
      - name: Startup smoke test
        run: npm run smoke

      - run: git diff --exit-code
