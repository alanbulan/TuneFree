name: Validate

# 质量门禁的唯一事实来源：ci.yml（push / PR）与 release.yml（v* 标签）都通过
# workflow_call 复用本文件，保证"能发布"和"CI 通过"是同一套检查。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / typecheck / test)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm

      - run: npm install --global npm@12.2.1
      - run: npm ci

      - run: npm run version:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run architecture:check
      - run: npm run test:coverage

      # 真实 Chromium 布局回归：happy-dom 无法验证 sticky 导航与滚动区域。
      - run: npx playwright install chromium
      - run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      # 高危及以上依赖漏洞阻断 CI 和发布。
      - name: Audit npm dependencies
        run: npm run audit

  rust:
    name: Rust (${{ matrix.os }} / fmt / clippy / test / build)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm

      - name: Read Rust toolchain
        id: rust
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel = "([^"]+)"$'
          if (-not $match) { throw 'Rust toolchain version is missing' }
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 2026-10-16
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm install --global npm@12.2.1
      - run: npm ci

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # lint 姿态固化在 src-tauri/Cargo.toml 的 [lints] 段，这里只负责把告警提升为错误。
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test app_tests -- --include-ignored

      # tauri.conf.json 的 beforeBuildCommand 已经会执行 `npm run build`（tsc + vite build），
      # 不要在此之外再单独跑一次前端构建。
      # Windows 与 macOS 各自构建并启动宿主可执行文件，不打包或发布。
      - name: Build native executable
        run: npx tauri build --no-bundle

      # 启动构建产物并断言主界面挂载且本地服务就绪。编译、clippy 与单元测试都
      # 无法发现「能编译但起不来」的故障（v1.1.28 即如此发布），这一步是唯一
      # 真正运行应用的检查。
      - name: Startup smoke test
        run: npm run smoke

      - run: git diff --exit-code
