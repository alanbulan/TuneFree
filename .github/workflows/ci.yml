name: CI

on:
  push:
    branches: [main, tauri]
  pull_request:

permissions:
  contents: read

# 同一分支/PR 上的新提交会取消尚未完成的旧运行，避免排队浪费 Windows runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
