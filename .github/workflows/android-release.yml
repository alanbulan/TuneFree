name: Android Release

on:
  push:
    branches:
      - flutter
    tags:
      - 'mobile-v*'
  pull_request:
    branches:
      - flutter
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing mobile-v* tag to publish; leave empty for a build only'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      # Public signing-certificate fingerprint from the previous official APK.
      ANDROID_RELEASE_CERT_SHA256: 5794243c2c473cc2860c1bd56865261e0a404e67ba719244475c732fb34dfdc3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          if [[ ! "$current" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo 'pubspec.yaml requires a stable version and build number.' >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[2]}"
          tag=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          fi
          publish=false
          notes=""
          if [[ -n "$tag" ]]; then
            if [[ "$tag" != "mobile-v$version" ]]; then
              echo 'The mobile release tag must match the committed app version.' >&2
              exit 1
            fi
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
              echo 'Run the workflow on the commit referenced by the release tag.' >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$tag_commit" origin/flutter; then
              echo 'Mobile releases must come from the flutter branch.' >&2
              exit 1
            fi
            notes="docs/releases/$tag.md"
            test -s "$notes"
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Require official release signing
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required release signing secret: $key" >&2
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep the SDK, dependency lock and golden baselines reproducible.
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Check generated build info is up to date
        run: dart run tool/generate_build_info.dart --check

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release
        env:
          TUNEFREE_REQUIRE_RELEASE_SIGNING: ${{ steps.release.outputs.publish }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify official APK signature and version
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BUILD: ${{ steps.release.outputs.build }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/37.0.0"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee build/apk-signature.txt
          grep -Fq "certificate SHA-256 digest: $ANDROID_RELEASE_CERT_SHA256" build/apk-signature.txt
          "$tools/aapt" dump badging "$apk" > build/apk-badging.txt
          grep -Fq "package: name='com.alanbulan.tunefree' versionCode='$RELEASE_BUILD' versionName='$RELEASE_VERSION'" build/apk-badging.txt
          grep -Fxq "targetSdkVersion:'37'" build/apk-badging.txt

      - name: Prepare APK and checksum assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [[ "$PUBLISH" != true ]]; then
            version="snapshot-${GITHUB_SHA::7}"
          fi
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/tunefree-$version.apk"
          cd build/release-assets
          sha256sum "tunefree-$version.apk" > SHA256SUMS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunefree-android-apk
          path: build/release-assets/*
          if-no-files-found: error

      - name: Check release has not already been published
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if release=$(gh release view "$RELEASE_TAG" --json isDraft); then
            test "$(jq -r '.isDraft' <<< "$release")" = true
          fi

      - name: Upload to draft GitHub Release
        if: steps.release.outputs.publish == 'true'
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TuneFree Mobile v${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.notes }}
          draft: true
          prerelease: false
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: build/release-assets/*

      - name: Verify uploaded assets and publish
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > build/github-release.json
          jq -e --arg apk "tunefree-$RELEASE_VERSION.apk" \
            '[.assets[] | select((.name == $apk or .name == "SHA256SUMS") and .size > 0)] | length == 2' \
            build/github-release.json
          gh release download "$RELEASE_TAG" --dir build/uploaded-assets
          (cd build/uploaded-assets && sha256sum --check SHA256SUMS)
          cmp "build/release-assets/tunefree-$RELEASE_VERSION.apk" "build/uploaded-assets/tunefree-$RELEASE_VERSION.apk"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=false -f make_latest=false
