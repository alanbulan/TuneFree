name: Android Release

on:
  push:
    branches:
      - main
      - flutter
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - flutter
  workflow_dispatch:
    inputs:
      bump_version:
        description: 'Auto-bump patch version and publish release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        if: github.event.inputs.bump_version == 'true' || startsWith(github.ref, 'refs/tags/v')
        id: bump
        run: |
          # Read current version from pubspec.yaml
          current=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          version_name="${current%%+*}"
          build_number="${current#*+}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Tag push: use tag as version
            new_version="${GITHUB_REF_NAME#v}"
            new_build=$((build_number + 1))
          else
            # workflow_dispatch bump: increment patch
            IFS='.' read -r major minor patch <<< "$version_name"
            new_version="${major}.${minor}.$((patch + 1))"
            new_build=$((build_number + 1))
          fi

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "build=${new_build}" >> "$GITHUB_OUTPUT"
          echo "full=${new_version}+${new_build}" >> "$GITHUB_OUTPUT"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: ${new_version}+${new_build}/" pubspec.yaml
          echo "Bumped to ${new_version}+${new_build}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK asset
        shell: bash
        run: |
          version="${{ steps.bump.outputs.version }}"
          if [ -z "$version" ]; then
            version="snapshot-${GITHUB_SHA::7}"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/tunefree-${version}.apk"
          echo "APK_PATH=build/app/outputs/flutter-apk/tunefree-${version}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunefree-android-apk
          path: ${{ env.APK_PATH }}

      - name: Commit version bump and tag
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "release: v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - name: Publish GitHub Release
        if: steps.bump.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: TuneFree Mobile v${{ steps.bump.outputs.version }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
