name: Release signed desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 发布流程不允许被后续标签取消，只做串行化。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 与 CI 完全相同的质量门禁：未通过 lint/typecheck/test/clippy 的提交无法发布。
  validate:
    uses: ./.github/workflows/validate.yml

  release-windows-x64:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: |
          npm install --global npm@11.6.2
          npm ci

      - name: Verify release tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      # releaseDraft: true —— updater endpoint 指向 releases/latest/download/latest.json，
      # 一旦发布为正式 Release，全部已安装客户端会立即自动升级。
      # 因此这里只产出草稿，由人工核对资产后再手动 Publish（见 RELEASE.md）。
      - name: Build, sign and publish the NSIS updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: TuneFree ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target x86_64-pc-windows-msvc
