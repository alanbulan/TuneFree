name: Release signed desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 发布流程不允许被后续标签取消，只做串行化。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 与 CI 完全相同的质量门禁：未通过 lint/typecheck/test/clippy 的提交无法发布。
  validate:
    uses: ./.github/workflows/validate.yml

  release-windows-x64:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: |
          npm install --global npm@11.6.2
          npm ci

      - name: Verify release tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      # tauri 与默认 flutter 分支的工作流不同。GitHub 要求创建这种提交的 Release
      # 时令牌同时拥有 Contents 和 Workflows 写权限，内置 GITHUB_TOKEN 无法满足。
      # 高权限 RELEASE_TOKEN 只交给 GitHub CLI，不暴露给第三方 Action 或构建脚本。
      - name: Create or reuse the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $release = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
            ConvertFrom-Json |
            Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME } |
            Select-Object -First 1

          if ($null -eq $release) {
            gh api "repos/$env:GITHUB_REPOSITORY/releases" `
              --method POST `
              -f tag_name="$env:GITHUB_REF_NAME" `
              -f target_commitish="$env:GITHUB_SHA" `
              -f name="TuneFree $env:GITHUB_REF_NAME" `
              -F draft=true `
              -F prerelease=false `
              -F generate_release_notes=true | Out-Null
            Write-Host "Created draft release for $env:GITHUB_REF_NAME."
          } elseif ($release.draft) {
            Write-Host "Reusing existing draft release for $env:GITHUB_REF_NAME."
          } else {
            throw "Release $env:GITHUB_REF_NAME is already published; refusing to overwrite it."
          }

      # 质量闸门由上面的 validate job 承担。构建资产先上传到不可见的草稿，
      # 只有安装包、签名和 latest.json 全部成功后，下一步才会公开 Release。
      - name: Build, sign and upload the NSIS updater
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: TuneFree ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target x86_64-pc-windows-msvc

      - name: Publish the completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $release = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
            ConvertFrom-Json |
            Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME -and $_.draft } |
            Select-Object -First 1

          if ($null -eq $release) {
            throw "Draft release $env:GITHUB_REF_NAME was not found after uploading assets."
          }

          gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" `
            --method PATCH `
            -F draft=false `
            -F prerelease=false `
            -f make_latest=true | Out-Null
