name: Release signed desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 发布流程不允许被后续标签取消，只做串行化。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 与 CI 完全相同的质量门禁：未通过 lint/typecheck/test/clippy 的提交无法发布。
  validate:
    uses: ./.github/workflows/validate.yml

  release-windows-x64:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: |
          npm install --global npm@11.6.2
          npm ci

      - name: Verify release tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      # releaseDraft: false —— 直接发布正式 Release，已安装客户端下次检查更新即可拉到。
      # 质量闸门由上面的 validate job 承担：它未通过则本 job 根本不会执行，
      # 未经验证的提交无法产出发布资产。
      - name: Build, sign and publish the NSIS updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: TuneFree ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target x86_64-pc-windows-msvc
